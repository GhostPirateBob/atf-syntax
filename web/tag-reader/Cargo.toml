# The ATF playground's tag reader, built to web/src/wasm/ by `npm run build:wasm`
# (scripts/build-vuio-wasm.mjs). Copied from vuio-media-info: see README.md.
[package]
name = "vuio-media-info"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.0"
authors = ["vyrti", "GhostPirateBob"]
license = "MIT OR Apache-2.0"
description = "Audio and video file metadata as MediaInfo-style JSON, as a WebAssembly module for the ATF playground"
repository = "https://github.com/GhostPirateBob/atf-syntax"
publish = false

[lib]
name = "vuio_media_info"
# cdylib: the .wasm (the build script builds only that); rlib: for the tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0"
thiserror = "2.0"
memchr = "2.8"

# Not part of the playground's npm workspace: its own Cargo workspace.
[workspace]

# Small over fast: the module is downloaded, and every file takes well under a millisecond.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
